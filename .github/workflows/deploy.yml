name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Я зашел под пользователем: $(whoami)"
            echo "Мое текущее местоположение: $(pwd)"
            echo "Список папок здесь:"
            ls -d */
            # Если папка найдется, идем в неё, если нет — создаем
            [ -d "~/my-devops-test" ] && cd ~/my-devops-test || (mkdir -p ~/my-devops-test && cd ~/my-devops-test)
            git config --global --add safe.directory $(pwd)
            git pull origin main || git clone git@github.com:dresky2024/my-devops-test.git .
            sudo docker-compose up -d --build


